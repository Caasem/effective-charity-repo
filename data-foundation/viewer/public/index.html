<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Foundation Viewer</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --text-dim: #9aa1ac;
    --accent: #4f8cff;
    --gov: #3ba55d;
    --org: #4f8cff;
    --third: #d99a2b;
    --derived: #9b6bdb;
    --unresolved: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  #sidebar header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar h1 {
    font-size: 15px;
    margin: 0 0 4px;
  }
  #overview {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  #search {
    margin: 12px 16px;
    padding: 8px 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
  }
  #org-list {
    overflow-y: auto;
    flex: 1;
    padding: 0 8px 16px;
  }
  .org-item {
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 2px;
  }
  .org-item:hover { background: var(--panel-2); }
  .org-item.active { background: var(--accent); color: white; }
  .org-item .name { font-weight: 600; }
  .org-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .org-item.active .meta { color: rgba(255,255,255,0.8); }

  #detail {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
  }
  #detail h2 { margin-top: 0; font-size: 22px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    color: white;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-gov { background: var(--gov); }
  .badge-org { background: var(--org); }
  .badge-third { background: var(--third); }
  .badge-derived { background: var(--derived); }
  .badge-unresolved { background: var(--unresolved); }

  section { margin-bottom: 32px; }
  section h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-dim); font-weight: 500; padding: 6px 8px; font-size: 11px; text-transform: uppercase; }
  td { padding: 8px; border-top: 1px solid var(--border); vertical-align: top; }
  td.source-cell a { color: var(--accent); text-decoration: none; font-size: 12px; }
  td.source-cell .date { color: var(--text-dim); font-size: 11px; display: block; margin-top: 2px; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
  }
  .empty { color: var(--text-dim); font-size: 13px; font-style: italic; }
  .candidate-row {
    background: rgba(217,83,79,0.08);
    border: 1px solid rgba(217,83,79,0.3);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .candidate-row .rationale { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  #placeholder { color: var(--text-dim); padding: 40px; font-size: 14px; }
</style>
</head>
<body>
  <div id="sidebar">
    <header>
      <h1>Data Foundation Viewer</h1>
      <div id="overview">Loading…</div>
    </header>
    <input id="search" placeholder="Filter organisations…" />
    <div id="org-list"></div>
  </div>
  <div id="detail">
    <div id="placeholder">Select an organisation from the list.</div>
  </div>

<script>
const listEl = document.getElementById('org-list');
const detailEl = document.getElementById('detail');
const searchEl = document.getElementById('search');
const overviewEl = document.getElementById('overview');

let orgs = [];
let activeId = null;

function sourceBadgeClass(sourceType) {
  if (!sourceType) return 'badge-derived';
  if (sourceType.includes('government')) return 'badge-gov';
  if (sourceType.includes('organisation')) return 'badge-org';
  if (sourceType.includes('third-party')) return 'badge-third';
  return 'badge-derived';
}

function fmtMoney(n) {
  if (n === null || n === undefined) return '—';
  return '£' + Number(n).toLocaleString();
}

function fmtDate(d) {
  if (!d) return '—';
  return String(d).slice(0, 10);
}

async function loadOverview() {
  const res = await fetch('/api/network-overview');
  const data = await res.json();
  overviewEl.innerHTML =
    data.resolvedEntities + ' resolved entities · ' +
    data.distinctLocations + ' locations · ' +
    data.coordinationEdges + ' coordination edges<br/>' +
    (data.unresolvedIdentityCandidates > 0
      ? '<span style="color:var(--unresolved)">' + data.unresolvedIdentityCandidates + ' unresolved identity candidate(s)</span>'
      : 'No unresolved identity candidates');
}

async function loadOrgs() {
  const res = await fetch('/api/organisations');
  orgs = await res.json();
  renderList();
}

function renderList() {
  const filter = searchEl.value.trim().toLowerCase();
  listEl.innerHTML = '';
  orgs
    .filter((o) => !filter || o.canonical_name.toLowerCase().includes(filter))
    .forEach((o) => {
      const div = document.createElement('div');
      div.className = 'org-item' + (o.organisation_id === activeId ? ' active' : '');
      div.innerHTML =
        '<div class="name">' + o.canonical_name + '</div>' +
        '<div class="meta">' + (o.registration_status || 'status unknown') +
        (o.income ? ' · ' + fmtMoney(o.income) + ' income' : '') + '</div>';
      div.onclick = () => selectOrg(o.organisation_id);
      listEl.appendChild(div);
    });
}

async function selectOrg(id) {
  activeId = id;
  renderList();
  detailEl.innerHTML = '<div id="placeholder">Loading…</div>';
  const res = await fetch('/api/organisations/' + encodeURIComponent(id));
  const data = await res.json();
  renderDetail(data);
}

function renderDetail(data) {
  const org = data.organisation;
  const src = data.source_record || {};

  let html = '<h2>' + org.canonical_name + '</h2>';
  html += '<div style="color:var(--text-dim);font-size:13px;margin-bottom:24px;">' +
    'Charity Commission #' + data.reg_charity_number +
    (src.charity_type ? ' · ' + src.charity_type : '') +
    (src.registration_status ? ' · ' + src.registration_status : '') +
    '</div>';

  // Facts (every one with its source badge)
  html += '<section><h3>Facts</h3>';
  if (data.facts.length === 0) {
    html += '<div class="empty">No facts collected yet.</div>';
  } else {
    html += '<table><thead><tr><th>Fact</th><th>Value</th><th>Confidence</th><th>Source</th></tr></thead><tbody>';
    for (const f of data.facts) {
      let value = f.fact_value;
      if (f.fact_type === 'financial_history_year') {
        try {
          const y = JSON.parse(value);
          value = y.ar_cycle_reference + ': income ' + fmtMoney(y.income) + ', expenditure ' + fmtMoney(y.expenditure) +
            ' (year end ' + fmtDate(y.financial_period_end_date) + ')';
        } catch (e) { /* leave raw */ }
      }
      html += '<tr>' +
        '<td>' + f.fact_type + '</td>' +
        '<td>' + value + '</td>' +
        '<td>' + f.confidence + '</td>' +
        '<td class="source-cell">' +
          '<span class="badge ' + sourceBadgeClass(f.source_type) + '">' + f.source_type + '</span><br/>' +
          '<a href="' + f.source_url + '" target="_blank" rel="noopener">' + f.source_name + '</a>' +
          '<span class="date">observed ' + fmtDate(f.observed_at) + ' · retrieved ' + fmtDate(f.retrieved_at) + '</span>' +
        '</td>' +
      '</tr>';
    }
    html += '</tbody></table>';
  }
  html += '</section>';

  // Classification
  html += '<section><h3>Classification (What / Who / How)</h3>';
  html += data.classified_as.length
    ? '<div class="tag-list">' + data.classified_as.map((c) =>
        '<span class="tag">' + JSON.parse(c.evidence).cause_name + '</span>').join('') + '</div>'
    : '<div class="empty">Not yet decoded into the graph.</div>';
  html += '</section>';

  // Area of operation
  html += '<section><h3>Area of Operation</h3>';
  html += data.operates_in.length
    ? '<div class="tag-list">' + data.operates_in.map((o) =>
        '<span class="tag">' + JSON.parse(o.evidence).location_name + '</span>').join('') + '</div>'
    : '<div class="empty">Not yet decoded into the graph.</div>';
  html += '</section>';

  // Trustees
  html += '<section><h3>Trustees</h3>';
  html += data.trustees.length
    ? '<div class="tag-list">' + data.trustees.map((t) => '<span class="tag">' + t.trustee_name + '</span>').join('') + '</div>'
    : '<div class="empty">No trustees collected.</div>';
  html += '</section>';

  // Coordination candidates
  html += '<section><h3>Coordination Candidates</h3>';
  if (data.coordination_candidates.length === 0) {
    html += '<div class="empty">None found — no shared operating location with another resolved entity yet.</div>';
  } else {
    html += '<div class="tag-list">' + data.coordination_candidates.map((c) => {
      let reason = '';
      try { reason = ' (' + JSON.parse(c.evidence).location + ')'; } catch (e) {}
      return '<span class="tag">' + c.canonical_name + reason + '</span>';
    }).join('') + '</div>';
  }
  html += '</section>';

  // Identity candidates — unresolved, flagged clearly, never silently merged
  html += '<section><h3>Identity Candidates <span class="badge badge-unresolved">unresolved = not merged</span></h3>';
  if (data.identity_candidates.length === 0) {
    html += '<div class="empty">No open identity candidates for this organisation.</div>';
  } else {
    html += data.identity_candidates.map((c) =>
      '<div class="candidate-row">' +
        '<strong>' + c.left_system + ':' + c.left_id + '</strong> ↔ <strong>' + c.right_system + ':' + c.right_id + '</strong>' +
        ' — ' + c.relationship + ' <span class="badge badge-unresolved">' + c.status + '</span>' +
        '<div class="rationale">' + c.rationale + '</div>' +
      '</div>'
    ).join('');
  }
  html += '</section>';

  detailEl.innerHTML = html;
}

searchEl.addEventListener('input', renderList);
loadOverview();
loadOrgs();
</script>
</body>
</html>
